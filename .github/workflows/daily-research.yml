name: WhySpark Daily Production

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whyspark-daily-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install free system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          ffmpeg -version
          ffprobe -version
          espeak-ng --version

      - name: Install free Python dependencies and local model runtimes
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect official-source research candidates
        run: python -m src.research

      - name: Generate script and verify factual claims locally
        run: python -m src.generate_episode

      - name: Render original visuals and local narration
        run: python -m src.render_short

      - name: Load persistent upload history
        if: vars.PUBLISH_ENABLED == 'true'
        run: |
          mkdir -p artifacts
          cp state/upload-history.json artifacts/upload-history.json

      - name: Publish only after every gate passes
        if: vars.PUBLISH_ENABLED == 'true'
        env:
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m src.youtube_upload

      - name: Persist duplicate-upload history
        if: success() && vars.PUBLISH_ENABLED == 'true'
        run: |
          cp artifacts/upload-history.json state/upload-history.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/upload-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update WhySpark upload history [skip ci]"
            git push
          fi

      - name: Save research, script, verification, and rendered video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whyspark-production-${{ github.run_id }}
          path: |
            artifacts/research.json
            artifacts/research-report.md
            artifacts/episode.json
            artifacts/render-report.json
            artifacts/whyspark-short.mp4
          if-no-files-found: warn
          retention-days: 7
