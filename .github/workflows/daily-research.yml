name: WhySpark Daily Research

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whyspark-daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Collect approved-source research candidates
        run: python -m src.research
      - name: Save research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whyspark-research-${{ github.run_id }}
          path: |
            artifacts/research.json
            artifacts/research-report.md
          if-no-files-found: warn
          retention-days: 7
