name: WhySpark CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"
      - name: Run safety gate tests
        run: python -m unittest discover -s tests -v
