name: WhySpark HyperFrames Shorts (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whyspark-hyperframes-short
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout WhySpark
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js for HyperFrames
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install free media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
          node --version
          npm --version
          ffmpeg -version
          ffprobe -version
          espeak-ng --version

      - name: Install CPU-only PyTorch
        run: python -m pip install --disable-pip-version-check --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"

      - name: Install free Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Collect official-source research
        run: python -m src.research

      - name: Draft episode and run local claim checks
        run: python -m src.generate_episode

      - name: Render cinematic 9:16 Short with HyperFrames
        run: python -m src.render_hyperframes

      - name: Upload review package (no YouTube publishing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whyspark-hyperframes-${{ github.run_id }}
          path: |
            artifacts/research.json
            artifacts/research-report.md
            artifacts/episode.json
            artifacts/render-report.json
            artifacts/whyspark-short.mp4
            artifacts/hyperframes/index.html
          if-no-files-found: warn
          retention-days: 7
